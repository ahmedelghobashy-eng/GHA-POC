name: Bridge parameter test

on:
  workflow_dispatch:
    inputs:
      message:
        description: Test value from TeamCity
        required: true
        default: from-default
        type: string

jobs:
  produce:
    name: Produce
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.value.outputs.message }}
    steps:
      - id: value
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          echo "Received: $MESSAGE"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

  consume:
    name: Consume
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - env:
          MESSAGE: ${{ needs.produce.outputs.message }}
        run: |
          echo "Received from Produce: $MESSAGE"
          echo "$MESSAGE" > handoff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: handoff.txt
