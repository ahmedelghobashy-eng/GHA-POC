name: TeamCity mirror POC

on:
  workflow_dispatch:

jobs:
  successful-job:
    name: Successful job
    runs-on: ubuntu-latest
    steps:
      - name: Print useful log lines
        run: |
          echo "POC log: starting successful job"
          echo "POC log: preparing test data"
          echo "POC log: successful job finished"
      - name: Passing test
        run: |
          echo "POC test: passing test started"
          test "TeamCity" = "TeamCity"
          echo "POC test: passing test passed"
      - name: Create artifact
        run: |
          mkdir -p output
          echo "Artifact from GitHub Actions" > output/result.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc-artifact
          path: output/result.txt

  failing-job:
    name: Failing job
    runs-on: ubuntu-latest
    steps:
      - name: Print failure log lines
        run: |
          echo "POC log: failing job started"
          echo "POC log: this job is intentionally failing"
          exit 1

  test-job:
    name: Test job
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests and write JUnit XML
        run: |
          mkdir -p test-results
          cat > test_poc.py <<'PY'
          def test_login_configuration_has_a_project_name():
              project_name = "TeamCity"
              assert project_name == "TeamCity"

          def test_logout_configuration_is_enabled():
              logout_enabled = True
              assert logout_enabled
          PY
          python -m pytest -q test_poc.py --junitxml=test-results/junit.xml
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 1
